name: Afiliados 2.0 - Homologacao segura etapa 50

on:
  push:
    branches:
      - feat/etapa50-homologacao-segura
  pull_request:
    branches:
      - chore/consolidacao-seguranca-etapa49
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etapa50-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulacoes:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      WA_META_ENABLE_SENDING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar pacotes sem iniciar browsers nem executar scripts
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund
      - name: Testar diagnostico somente leitura
        run: node --test tests/etapa50-diagnostico.test.mjs tests/etapa50-manifest-neutral.test.mjs tests/etapa50-link-controlado.test.mjs tests/etapa50-url-manual.test.mjs
      - name: Dominios de ofertas e OAuth simulados
        run: node --import tsx --test tests/mercadolivre-auth.mts tests/mercadolivre-descoberta.mts tests/mercadolivre-resiliencia.mts tests/mercadolivre-disponibilidade.mts tests/mercadolivre-estoque-integracao.mts tests/etapa53-preco-vendedor-estoque.mts tests/etapa54-preco-contextual.mts tests/etapa55-investigacao-sem-vencedor.mts tests/etapa56-anuncio-direto.mts tests/mercadolivre-link-diagnostico.mts tests/mercadolivre-link-diagnostico-integracao.mts tests/variedade-ofertas.mts tests/amazon-preco-dom.mts tests/historico-antiduplicado.mts tests/whatsapp-grupo.mts tests/painel-dominios.mts
      - name: Diagnostico agregado de ofertas - GET local simulado, sem dados sensiveis
        run: node --import tsx --test tests/auditoria-funil-ofertas.mts
      - name: Cupons e destinos oficiais — politicas e seguranca, sem envios
        run: node --import tsx --test tests/cupons-politica.mts tests/cupons-whatsapp-seguro.mts tests/etapa51-cupons-politica.mts tests/mercadolivre-destino.mts tests/mercadolivre-destino-navegador.mts tests/precos-qualidade.mts
      - name: Governanca de canais e elegibilidade comercial - etapa 57, sem envios
        run: node --import tsx --test tests/etapa57-canais.mts
      - name: Etapa 58 - consulta de evidencias somente leitura
        run: node --import tsx --test tests/etapa58-revisao.mts
      - name: Etapa 58 - painel de revisao visual isolado, sem envios
        run: node --import tsx tests/etapa58-revisao-visual.mts
      - name: Home de metricas sem login - roteamento e leitura local
        run: node --import tsx --test tests/home-metricas.mts
      - name: Home de metricas visual - desktop e celular, sem login
        run: node --import tsx tests/home-metricas-visual.mts
      - name: Lovable UX - navegação unificada e tokens compartilhados
        run: node --import tsx --test tests/ux-lovable-transfer.mts
      - name: Lovable UX - cinco rotas no desktop e celular, sem login
        run: node --import tsx tests/ux-lovable-visual.mts
      - name: UX Unificada v2 - aprovado visual, links e controles reais em 3 resolucoes
        run: node --import tsx tests/ux-unificada-v2.mts
      - name: Conexao WhatsApp - detectar QR, autenticacao e fechamento sem mensagens
        run: node --import tsx --test tests/whatsapp-login-estado.mts
      - name: Interface simulada em Chrome headless, sem perfil do usuario
        run: node --import tsx tests/painel-operacional.mts
      - name: Conector 02 em Chrome headless com formularios ficticios
        run: node --import tsx tests/mercadolivre-extensao.mts
      - name: TypeScript
        run: npm.cmd run typecheck
      - name: Dependencias
        run: npm.cmd audit --audit-level=high
