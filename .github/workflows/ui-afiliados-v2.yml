name: Afiliados 2.0 - Validacao visual segura

on:
  push:
    branches:
      - refactor/unificar-paineis-v2
  pull_request:
    branches:
      - feat/convites-whatsapp-web-supervisionado
    paths:
      - 'src/painel/**'
      - 'captacao/caca-promos-vip/src/**'
      - 'captacao/caca-promos-vip/tests/afiliados-v2.test.mjs'
      - 'captacao/caca-promos-vip/tests/afiliados-v2-visual.mjs'
      - 'captacao/caca-promos-vip/tests/layout-clean.test.mjs'
      - 'tests/central-unificada.mts'
      - 'package.json'
      - '.github/workflows/ui-afiliados-v2.yml'
  workflow_dispatch:

concurrency:
  group: ui-afiliados-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface:
    name: Contratos e estilos sem envios reais
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Clonar a branch de revisao
        uses: actions/checkout@v4
      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias do projeto
        run: npm ci
      - name: Verificar tipagem e integridade de modulos
        run: npm run typecheck
      - name: Checar Central Unificada e Ofertas
        run: npm run test:central-unificada
      - name: Testar rotas locais e isolamento das paginas publicas
        run: node --test captacao/caca-promos-vip/tests/afiliados-v2.test.mjs
      - name: Verificar em Chrome headless - desktop e mobile
        run: node captacao/caca-promos-vip/tests/afiliados-v2-visual.mjs
        env:
          AFILIADOS_V2_SCREENSHOTS: ui-screenshots
      - name: Publicar capturas apenas de dados temporarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-afiliados-v2
          path: ui-screenshots/*.png
          if-no-files-found: ignore
