name: Validar Afiliados

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --prefix captacao/caca-promos-vip
      - run: npm run test:mercadolivre-auth
      - run: npm run test:mercadolivre-qualidade
      - run: npm run test:mercadolivre-recuperacao
      - run: npm run test:mercadolivre-assistido
      - run: npm run test:meli09
      - run: npm run test:meli10
      - run: npm run test:meli10e
      - run: npm run test:meli10e-ui
      - run: npm run test:meli11
      - run: npm run test:meli11-ui
      - run: npm run test:painel-operacional
      - run: npm run test:modos-busca
      - run: npm run test:historico-antiduplicado
      - run: npm run test:amazon-preco-dom
      - run: npm run test:whatsapp-auto-send
      - run: npm run test:whatsapp-busca
      - run: npm run test:whatsapp-pointer
      - run: npm run test:whatsapp-observer
      - run: npm run test:recuperacao-central
      - run: npm run test:recuperacao-visual
      - run: npm run test:central-visual-integridade
      - run: npm run test:ux-contrato
      - name: Anexar evidencias de UX (somente dados sinteticos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-fixture-capturas
          path: |
            test-results/ux/*.png
            test-results/ux03/*.png
            test-results/meli/*.png
            test-results/meli07/*.png
            test-results/meli10e-ui/*.png
            test-results/meli09/*.png
          if-no-files-found: ignore
          retention-days: 7
